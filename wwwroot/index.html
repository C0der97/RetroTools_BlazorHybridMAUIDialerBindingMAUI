<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PayRemind</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/glassmorphism.css" />
    <link rel="stylesheet" href="PayRemind.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <style type="text/css">
        .custom-success-button {
            background-color: #3e9108;
            color: #c6ffaa !important;
            /* Color del texto */
            border: none;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        /* Estilo del botón cuando se pasa el mouse por encima */
        .custom-success-button:hover {
            background-color: darkgreen;
            /* Cambia el color al pasar el mouse */
            transform: scale(1.05);
            /* Aumenta ligeramente el tamaño */
        }

        /* Estilo del botón cuando se hace clic (active) */
        .custom-success-button:active {
            background-color: green;
            /* Color cuando está activo */
            transform: scale(0.95);
            /* Disminuye ligeramente el tamaño */
        }

        /* Estilo del botón cuando está deshabilitado */
        .custom-success-button:disabled {
            background-color: gray;
            /* Color del botón deshabilitado */
            cursor: not-allowed;
            opacity: 0.6;
        }

        :root {
            --rz-primary: #3dc4a4;
            /* Color primario */
            --rz-secondary: #6c757d;
            /* Color secundario */
            --rz-success: #28a745;
            /* Color de éxito */
            --rz-danger: #dc3545;
            /* Color de peligro */
            --rz-warning: #ffc107;
            /* Color de advertencia */
            --rz-info: #17a2b8;
            /* Color de información */
            --rz-light: #f8f9fa;
            /* Color claro */
            --rz-dark: #343a40;
            /* Color oscuro */
            /* Puedes añadir más variables si lo necesitas */
        }
    </style>
</head>


<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="spinner-border" role="status">
            <span class="visually-hidden"></span>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        window.loadRadzenTheme = function (theme) {
            var link = document.querySelector('link[href*="_content/Radzen.Blazor/css/"]');
            if (link) {
                link.href = `_content/Radzen.Blazor/css/${theme}.css`;
            }

            if (theme && theme.includes("dark")) {
                // document.body.style.backgroundColor = "black"; // Disabled to allow glassmorphism gradient
                // document.body.style.color = "white";
            }
        };

        window.preventDefaultOnClick = function (id) {
            document.getElementById(id).addEventListener('click', function (event) {
                event.preventDefault();
            });
        }
    </script>

    <script>
        window.callBlazorMethod = (methodName, ...args) => {
            return DotNet.invokeMethodAsync('PayRemind', methodName, ...args);
        }
    </script>

</body>

</html>
